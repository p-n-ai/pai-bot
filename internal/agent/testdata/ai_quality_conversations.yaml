    checks:
      require_non_empty_replies: true
      forbid_fallback_message: true
      forbid_markdown_and_latex: true
      forbid_final_answer_on_turn: [1]
      forbid_section_labels_on_turn: [1]
      max_response_lines: 5
      max_response_chars: 420

