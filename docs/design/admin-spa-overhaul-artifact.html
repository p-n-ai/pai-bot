<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>P&amp;AI Tutor — Build AI illustrative component</title>
    <style>
      :root {
        color-scheme: light;
        --surface: #ffffff;
        --surface-subtle: #f6faf8;
        --surface-muted: #eaf2ee;
        --surface-accent: #e0f4ea;
        --surface-info: #eaf4f8;
        --surface-warning: #fff2c9;
        --surface-danger: #fdecea;
        --brand: #006b46;
        --brand-hover: #00563a;
        --text-heading: #15362c;
        --text-body: #314b42;
        --text-muted: #5d716a;
        --text-on-brand: #ffffff;
        --border: #c6d5cf;
        --border-strong: #829b92;
        --positive: #006b46;
        --warning: #765000;
        --danger: #973426;
        --info: #145f7c;
        --focus: #0645ad;
        --radius-sm: 0.5rem;
        --radius-md: 0.75rem;
        --sidebar: 16rem;
        --preview: 26rem;
        --target: 2.75rem;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
      }

      *, *::before, *::after { box-sizing: border-box; }
      html { min-inline-size: 20rem; background: var(--surface); }
      body {
        margin: 0;
        min-inline-size: 20rem;
        min-block-size: 100vh;
        color: var(--text-body);
        background: var(--surface);
        font-size: 1rem;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }
      body.preview-open { overflow: hidden; }
      button, input, select { font: inherit; color: inherit; }
      button, a, input, select, summary { scroll-margin-block: 1rem; }
      button { touch-action: manipulation; }
      :focus-visible { outline: 0.1875rem solid var(--focus); outline-offset: 0.1875rem; }
      ::selection { color: var(--text-heading); background: #b9ead4; }
      h1, h2, h3, p { margin-block-start: 0; }
      h1, h2, h3 { color: var(--text-heading); line-height: 1.2; text-wrap: balance; }
      h1 { margin-block-end: 0.7rem; font-size: clamp(1.9rem, 3.6vw, 2.75rem); letter-spacing: -0.025em; }
      h2 { margin-block-end: 0.55rem; font-size: clamp(1.3rem, 2vw, 1.65rem); letter-spacing: -0.015em; }
      h3 { margin-block-end: 0.4rem; font-size: 1rem; }
      p { max-inline-size: 72ch; margin-block-end: 1rem; }
      a { color: var(--brand); text-decoration-thickness: 0.08em; text-underline-offset: 0.18em; }
      a:hover { color: var(--text-heading); }
      svg { display: block; }
      fieldset { min-inline-size: 0; margin: 0; padding: 0; border: 0; }
      legend { padding: 0; color: var(--text-heading); font-weight: 750; }
      ul, ol { max-inline-size: 76ch; }
      .sr-only {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .skip-link {
        position: fixed;
        z-index: 300;
        inset-block-start: 0.5rem;
        inset-inline-start: 0.5rem;
        min-block-size: var(--target);
        padding: 0.65rem 1rem;
        border: 2px solid var(--text-heading);
        border-radius: var(--radius-sm);
        color: var(--text-heading);
        background: var(--surface);
        transform: translateY(-160%);
      }
      .skip-link:focus { transform: translateY(0); }

      .app-shell { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-block-size: 100vh; }
      .sidebar {
        position: sticky;
        inset-block-start: 0;
        z-index: 80;
        display: flex;
        flex-direction: column;
        min-inline-size: 0;
        block-size: 100vh;
        border-inline-end: 1px solid var(--border);
        background: var(--surface-subtle);
      }
      .brand { display: flex; align-items: center; gap: 0.7rem; min-block-size: 4.5rem; padding: 0.85rem 1rem; border-block-end: 1px solid var(--border); color: var(--text-heading); font-weight: 780; }
      .brand-mark, .bot-mark {
        display: grid;
        place-items: center;
        inline-size: 2.25rem;
        block-size: 2.25rem;
        flex: 0 0 auto;
        border-radius: 0.65rem;
        color: var(--text-on-brand);
        background: var(--brand);
      }
      .workspace-links { display: grid; gap: 0.25rem; padding: 0.85rem; border-block-end: 1px solid var(--border); }
      .workspace-link, .nav-link {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        min-block-size: var(--target);
        padding: 0.58rem 0.7rem;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        color: var(--text-body);
        text-decoration: none;
      }
      .workspace-link:hover, .nav-link:hover { border-color: var(--border); color: var(--text-heading); background: var(--surface); }
      .workspace-link[aria-current="page"], .nav-link[aria-current="page"] { border-color: var(--border-strong); color: var(--text-heading); background: var(--surface); font-weight: 750; }
      .nav-region { flex: 1; overflow: auto; padding: 0.85rem; }
      .nav-heading { margin: 0.35rem 0.55rem 0.5rem; color: var(--text-muted); font-size: 0.75rem; font-weight: 780; letter-spacing: 0.06em; text-transform: uppercase; }
      .nav-list { display: grid; gap: 0.2rem; margin: 0; padding: 0; list-style: none; }
      .sidebar-note { padding: 1rem; margin: 0; border-block-start: 1px solid var(--border); color: var(--text-muted); font-size: 0.8rem; }
      .scrim { display: none; }

      .app-area { min-inline-size: 0; }
      .topbar {
        position: sticky;
        inset-block-start: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        min-block-size: 4.5rem;
        padding: 0.75rem clamp(1rem, 3vw, 2rem);
        border-block-end: 1px solid var(--border);
        background: var(--surface);
      }
      .topbar-start { display: flex; align-items: center; gap: 0.75rem; min-inline-size: 0; }
      .menu-button { display: none; }
      .context-title { min-inline-size: 0; }
      .context-title strong { display: block; color: var(--text-heading); font-size: 0.95rem; }
      .context-title span { display: block; color: var(--text-muted); font-size: 0.8rem; }
      .topbar-meta { display: flex; align-items: center; gap: 0.6rem; }
      .avatar { display: grid; place-items: center; inline-size: var(--target); block-size: var(--target); flex: 0 0 auto; border: 1px solid var(--border-strong); border-radius: 50%; color: var(--text-heading); background: var(--surface-subtle); font-size: 0.78rem; font-weight: 780; }
      .view { min-inline-size: 0; }
      .builder-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(21rem, var(--preview)); align-items: start; min-block-size: calc(100vh - 4.5rem); }
      .page { min-inline-size: 0; padding: clamp(1.4rem, 4vw, 3rem) clamp(1rem, 4vw, 3.5rem) 4rem; }
      .page-inner { max-inline-size: 72rem; }
      .breadcrumb { margin: 0 0 0.65rem; color: var(--text-muted); font-size: 0.84rem; }
      .breadcrumb a { color: inherit; }
      .page-header { margin-block-end: 2.25rem; }
      .page-header .lead { margin: 0; color: var(--text-body); font-size: 1.05rem; }
      .page-header-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-block-start: 1.15rem; }
      .stack { display: grid; gap: 2.25rem; }
      .section { min-inline-size: 0; }
      .section + .section { padding-block-start: 2.25rem; border-block-start: 1px solid var(--border); }
      .section-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-block-end: 1rem; }
      .section-heading p { margin: 0; color: var(--text-muted); }
      .split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem; }
      .compact-block { padding: 1.25rem; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); }
      .compact-block > :last-child { margin-block-end: 0; }
      .notice { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.75rem; padding: 1rem; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--surface-subtle); }
      .notice .icon { margin-block-start: 0.15rem; color: var(--info); }
      .notice strong { display: block; color: var(--text-heading); }
      .notice p { margin: 0.2rem 0 0; }
      .notice.warning { border-color: #b38b29; background: var(--surface-warning); }
      .notice.warning .icon { color: var(--warning); }
      .notice.danger { border-color: #c5796e; background: var(--surface-danger); }
      .notice.danger .icon { color: var(--danger); }
      .notice.success { border-color: #5b9c81; background: var(--surface-accent); }
      .notice.success .icon { color: var(--positive); }
      .notice.info { border-color: #76a7b9; background: var(--surface-info); }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        min-block-size: var(--target);
        max-inline-size: 100%;
        padding: 0.65rem 1rem;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        color: var(--text-heading);
        background: var(--surface);
        font-weight: 750;
        line-height: 1.25;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
      }
      .button:hover { color: var(--text-heading); background: var(--surface-subtle); }
      .button.primary { border-color: var(--brand); color: var(--text-on-brand); background: var(--brand); }
      .button.primary:hover { border-color: var(--brand-hover); color: var(--text-on-brand); background: var(--brand-hover); }
      .button.subtle { border-color: transparent; background: transparent; }
      .button.danger { border-color: var(--danger); color: var(--danger); }
      .button:disabled { border-color: var(--border); color: var(--text-muted); background: var(--surface-muted); cursor: not-allowed; }
      .button.icon-only { inline-size: var(--target); padding: 0; }
      .inline-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-block-start: 1rem; }
      .inline-links { display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; }
      .icon { inline-size: 1.1rem; block-size: 1.1rem; flex: 0 0 auto; stroke-width: 1.9; }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        min-block-size: 1.75rem;
        max-inline-size: 100%;
        padding: 0.22rem 0.52rem;
        border: 1px solid var(--border-strong);
        border-radius: 999px;
        color: var(--text-body);
        background: var(--surface);
        font-size: 0.78rem;
        font-weight: 750;
        line-height: 1.25;
      }
      .status.positive { border-color: #5b9c81; color: var(--positive); background: var(--surface-accent); }
      .status.warning { border-color: #b38b29; color: var(--warning); background: var(--surface-warning); }
      .status.danger { border-color: #c5796e; color: var(--danger); background: var(--surface-danger); }
      .status.info { border-color: #76a7b9; color: var(--info); background: var(--surface-info); }
      .status .icon { inline-size: 0.9rem; block-size: 0.9rem; }

      .destination-map { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 0; padding: 0; border-block: 1px solid var(--border); list-style: none; }
      .destination-map li { min-inline-size: 0; }
      .destination-map a { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; min-block-size: 3.5rem; padding: 0.75rem; color: var(--text-heading); text-decoration: none; }
      .destination-map a:hover { background: var(--surface-subtle); }
      .destination-map li:nth-child(n+4) { border-block-start: 1px solid var(--border); }
      .destination-map li:not(:nth-child(3n+1)) { border-inline-start: 1px solid var(--border); }
      .destination-state { color: var(--text-muted); font-size: 0.75rem; font-weight: 700; text-align: end; }
      .state-list, .event-list, .locked-list, .version-list, .class-list { margin: 0; padding: 0; list-style: none; }
      .state-list li, .event-list li, .version-list li, .class-list li { padding-block: 0.85rem; border-block-end: 1px solid var(--border); }
      .state-list li:first-child, .event-list li:first-child, .version-list li:first-child, .class-list li:first-child { border-block-start: 1px solid var(--border); }
      .state-list strong, .event-list strong, .version-list strong, .class-list strong { color: var(--text-heading); }
      .state-list p, .event-list p, .version-list p, .class-list p { margin: 0.2rem 0 0; color: var(--text-muted); font-size: 0.88rem; }
      .row-between { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
      .change-list { margin-block-end: 0; }

      .detail-list { display: grid; grid-template-columns: minmax(9rem, 0.75fr) minmax(0, 1.5fr); margin: 0; }
      .detail-list dt, .detail-list dd { margin: 0; padding-block: 0.8rem; border-block-end: 1px solid var(--border); }
      .detail-list dt { color: var(--text-muted); }
      .detail-list dd { color: var(--text-heading); font-weight: 680; }
      details { padding-block: 0.25rem; }
      summary { min-block-size: var(--target); padding-block: 0.6rem; color: var(--brand); font-weight: 720; cursor: pointer; }
      .field-grid { display: grid; gap: 1.5rem; }
      .field-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
      .field { min-inline-size: 0; }
      .field-label { display: block; margin-block-end: 0.35rem; color: var(--text-heading); font-size: 0.9rem; font-weight: 750; }
      .field-hint { margin: 0.35rem 0 0; color: var(--text-muted); font-size: 0.82rem; }
      select, input[type="text"] { inline-size: 100%; min-block-size: var(--target); padding: 0.65rem 0.75rem; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); font-size: 1rem; }
      select:hover, input[type="text"]:hover { border-color: var(--text-body); }
      .choice-set { display: grid; gap: 0.65rem; margin-block-start: 0.65rem; }
      .choice { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; gap: 0.7rem; min-block-size: var(--target); padding: 0.7rem; border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; }
      .choice:has(input:checked) { border-color: var(--brand); background: var(--surface-accent); }
      .choice input { inline-size: 1.1rem; block-size: 1.1rem; margin-block-start: 0.18rem; accent-color: var(--brand); }
      .choice strong { display: block; color: var(--text-heading); }
      .choice span { display: block; color: var(--text-muted); font-size: 0.84rem; }
      .form-footer { display: flex; flex-wrap: wrap; gap: 0.75rem; padding-block-start: 1.5rem; border-block-start: 1px solid var(--border); }

      .preview-pane { position: sticky; inset-block-start: 4.5rem; align-self: start; min-inline-size: 0; block-size: calc(100vh - 4.5rem); padding: 1.25rem; border-inline-start: 1px solid var(--border); background: var(--surface-subtle); overflow: auto; }
      .preview-shell { min-block-size: 100%; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--surface); overflow: hidden; }
      .preview-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; padding: 1rem; border-block-end: 1px solid var(--border); }
      .preview-title { display: flex; gap: 0.65rem; min-inline-size: 0; }
      .preview-title h2 { margin: 0; font-size: 1rem; }
      .preview-title p { margin: 0.2rem 0 0; color: var(--text-muted); font-size: 0.78rem; }
      .preview-back { display: none; }
      .preview-body { padding: 1rem; }
      .preview-binding { color: var(--text-muted); font-size: 0.82rem; }
      .synthetic-example { margin-block: 1rem; padding-block: 1rem; border-block: 1px solid var(--border); }
      .synthetic-example p:last-child { margin-block-end: 0; }
      .citation-list { margin-block-end: 0; padding-inline-start: 1.25rem; color: var(--text-muted); font-size: 0.84rem; }
      .empty-state { padding-block: 2rem; text-align: start; }
      .empty-state p { color: var(--text-muted); }
      .mobile-preview-action { display: none; }

      .evidence-list { margin: 0; padding: 0; list-style: none; border-block-start: 1px solid var(--border); }
      .evidence-row { padding-block: 1rem; border-block-end: 1px solid var(--border); }
      .evidence-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
      .evidence-head h3 { margin-block-end: 0.2rem; }
      .evidence-head p { margin: 0; color: var(--text-muted); font-size: 0.84rem; }
      .evidence-row details p { margin: 0.35rem 0; font-size: 0.88rem; }
      .readiness-list { margin: 0; padding: 0; list-style: none; counter-reset: readiness; border-block-start: 1px solid var(--border); }
      .readiness-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 0.85rem; padding-block: 1rem; border-block-end: 1px solid var(--border); counter-increment: readiness; }
      .readiness-row::before { content: counter(readiness); display: grid; place-items: center; inline-size: 1.75rem; block-size: 1.75rem; border: 1px solid var(--border-strong); border-radius: 50%; color: var(--text-heading); font-size: 0.8rem; font-weight: 780; }
      .readiness-copy strong { display: block; color: var(--text-heading); }
      .readiness-copy p { margin: 0.2rem 0 0; color: var(--text-muted); font-size: 0.85rem; }
      .version-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1rem; }
      .version-meta { display: flex; flex-wrap: wrap; gap: 0.4rem 0.8rem; margin-block-start: 0.55rem; color: var(--text-muted); font-size: 0.8rem; }
      .version-actions { display: flex; align-items: flex-start; }
      .incident-selector { max-inline-size: 30rem; }

      dialog { inline-size: min(34rem, calc(100% - 2rem)); max-block-size: calc(100vh - 2rem); padding: 0; border: 1px solid var(--border-strong); border-radius: var(--radius-md); color: var(--text-body); background: var(--surface); }
      dialog::backdrop { background: rgb(21 54 44 / 0.5); }
      .dialog-body { padding: 1.35rem; }
      .dialog-body h2 { margin-block-end: 0.6rem; }
      .dialog-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.75rem; padding: 1rem 1.35rem; border-block-start: 1px solid var(--border); }
      .prototype-note { margin-block-start: 2rem; color: var(--text-muted); font-size: 0.78rem; }
      .live-region { position: fixed; z-index: 250; inset-inline-end: 1rem; inset-block-end: 1rem; max-inline-size: min(28rem, calc(100vw - 2rem)); padding: 0.75rem 1rem; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); color: var(--text-heading); background: var(--surface); }
      .live-region:empty { display: none; }

      @media (max-width: 70rem) {
        .builder-layout { grid-template-columns: minmax(0, 1fr); }
        .preview-pane { display: none; }
        .preview-pane.is-open { position: fixed; z-index: 200; inset: 0; display: block; block-size: 100dvh; padding: 0; border: 0; background: var(--surface); overflow: auto; }
        .preview-pane.is-open .preview-shell { min-block-size: 100dvh; border: 0; border-radius: 0; }
        .preview-pane.is-open .preview-header { position: sticky; inset-block-start: 0; z-index: 1; background: var(--surface); }
        .preview-back, .mobile-preview-action { display: inline-flex; }
      }
      @media (max-width: 51.25rem) {
        .app-shell { grid-template-columns: minmax(0, 1fr); }
        .sidebar { position: fixed; inset: 0 auto 0 0; inline-size: min(18rem, calc(100vw - 3rem)); block-size: 100dvh; transform: translateX(-105%); transition: transform 160ms ease-out; }
        .app-shell.menu-open .sidebar { transform: translateX(0); }
        .scrim { position: fixed; z-index: 70; inset: 0; border: 0; background: rgb(21 54 44 / 0.45); }
        .app-shell.menu-open .scrim { display: block; }
        .menu-button { display: inline-flex; }
        .topbar { min-block-size: 4rem; }
        .builder-layout { min-block-size: 0; }
      }
      @media (max-width: 42rem) {
        .split, .field-row { grid-template-columns: minmax(0, 1fr); }
        .destination-map { grid-template-columns: minmax(0, 1fr); }
        .destination-map li:nth-child(n+2) { border-block-start: 1px solid var(--border); }
        .destination-map li:not(:nth-child(3n+1)) { border-inline-start: 0; }
        .section-heading, .row-between, .evidence-head { display: grid; }
        .detail-list { grid-template-columns: minmax(0, 1fr); }
        .detail-list dt { padding-block-end: 0.15rem; border-block-end: 0; }
        .detail-list dd { padding-block-start: 0.15rem; }
        .readiness-row { grid-template-columns: auto minmax(0, 1fr); }
        .readiness-row > .status { grid-column: 2; justify-self: start; }
        .version-item { grid-template-columns: minmax(0, 1fr); }
        .dialog-actions { justify-content: stretch; }
        .dialog-actions .button { inline-size: 100%; }
      }
      @media (max-width: 30rem) {
        .topbar-meta .status { display: none; }
        .page { padding-inline: 1rem; }
        .form-footer .button, .form-footer a, .page-header-actions .button, .page-header-actions a { inline-size: 100%; }
        .inline-actions { display: grid; }
        .inline-actions .button, .inline-actions a { inline-size: 100%; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
      }
      @media (prefers-contrast: more) {
        :root { --border: #667c74; --border-strong: #263f36; --text-muted: #425850; --surface-muted: #e2ebe7; }
        .button, select, input[type="text"], .choice, .compact-block, .notice, .preview-shell, dialog { border-width: 2px; }
        .status { border-width: 2px; }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#mainContent">Skip to main content</a>
    <div class="app-shell" id="appShell">
      <aside class="sidebar" id="sidebar" aria-label="Application navigation">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">

        }
        function requestReviewChanges() {
          if (!state.reviewTask || state.reviewTask.status !== "requested") return;
          state.reviewTask.status = "changes-requested";
          state.educatorReview.status = "changes-requested";
          state.educatorReview.updatedAt = "Just now";
          renderRoute();
          announce("Synthetic reviewer requested changes. Publish remains blocked.");
        }
        function showDialog(dialog) {
          if (!dialog) return;
          if (typeof dialog.showModal === "function") dialog.showModal(); else dialog.setAttribute("open", "");
        }
        function closeDialog(dialog) {
          if (!dialog) return;
          if (typeof dialog.close === "function") dialog.close(); else dialog.removeAttribute("open");
        }
        function publishVersion() {
          if (!canPublish()) return;
          closeDialog(document.getElementById("publicationDialog"));
          state.publishedVersions.forEach(version => { version.latest = false; });
          const identifier = `PV-SIM-${String(Date.now()).slice(-6)}`;
          state.publishedVersions.unshift({ id: identifier, latest: true, note: state.versionNote.trim(), publisher: "Nabila Rahman", time: "Just now", curriculum: state.draft.curriculum.revision, tests: `Passed · ${state.tests.runAt}`, review: `${state.educatorReview.reviewer} · complete`, classes: 0 });
          state.draft.baseVersionId = identifier;
          state.draft.changedSections = [];
          state.draft.savedChangedSections = [];
          state.publicationSuccess = `Published version ${identifier} is available. No classes changed.`;
          state.versionNote = "";
          state.activityEvents.unshift(["Published version made available", `${identifier} became available to teachers. No class changed.`, "Just now"]);
          renderRoute();
          announce(state.publicationSuccess);
        }
        function openStartDraftDialog(versionId) {
          const dialog = document.getElementById("startDraftDialog");
          const latest = latestVersion();
          document.getElementById("startDraftVersion").value = versionId;
          document.getElementById("startDraftCopy").textContent = `A new private Draft will start from ${versionId}. Published version ${latest.id} remains available to teachers, Version history is preserved, and no class changes. The existing private Draft will be replaced only after this confirmation.`;
          showDialog(dialog);
        }
        function confirmStartDraft() {
          const versionId = document.getElementById("startDraftVersion")?.value;
          const source = state.publishedVersions.find(version => version.id === versionId);
          if (!source) return;
          closeDialog(document.getElementById("startDraftDialog"));
          const revisionNumber = Number((state.draft.savedRevision.match(/\d+/) || ["7"])[0]) + 1;
          state.draft.savedRevision = `Draft revision ${revisionNumber}`;
          state.draft.savedAt = "Just now";
          state.draft.savedBy = "Nabila Rahman";
          state.draft.baseVersionId = source.id;
          state.draft.curriculum.revision = source.curriculum;
          state.draft.curriculum.bundle = source.curriculum === "2026.07" ? "math-f1-jul" : "math-f1-aug";
          state.draft.savedCurriculumBundle = state.draft.curriculum.bundle;
          state.draft.teaching = deepCopy(initialTeaching);
          state.draft.savedTeaching = deepCopy(initialTeaching);
          state.draft.unsaved = false;
          state.draft.changedSections = [];
          state.draft.savedChangedSections = [];
          state.tests.status = "out-of-date";
          state.tests.fresh = false;
          state.tests.invalidatedBy = "a Draft was started from an earlier Published version";
          state.educatorReview.status = "out-of-date";
          state.educatorReview.draftRevision = "Prior Draft";
          state.publicationSuccess = "";
          renderRoute();
          announce(`New private ${state.draft.savedRevision} started from ${source.id}. Published history and class use were preserved.`);
        }
        function activityIncidentMarkup() {
          if (state.activityMode !== "incident") return "";
          const latest = latestVersion();
          return `<section class="section" id="activeIncident" aria-labelledby="incidentHeading"><h2 id="incidentHeading">Critical synthetic Incident</h2><dl class="detail-list"><dt>Aggregate impact</dt><dd>Illustrative delivery failures on one enabled channel; no learner identities shown</dd><dt>Affected version</dt><dd>${escapeHTML(latest.id)}</dd><dt>Owner</dt><dd>Nabila Rahman · synthetic</dd><dt>Evidence freshness</dt><dd>Just now · local selector only</dd><dt>Safest next action</dt><dd>Inspect school channel setup, then prepare a recovery Draft only if Tutor behavior must change</dd></dl><div class="inline-actions"><a class="button primary" href="${routeHref("school", "channels")}" data-nav>Inspect channel setup</a><a class="button" href="${buildHref("publish", "#versionHistory")}" data-nav>Prepare recovery Draft</a>${button("Acknowledge synthetic Incident", "ack-incident", "")}</div><p class="field-hint">Resolving an Incident would not resume a paused service, and resuming would not resolve an Incident.</p></section>`;
        }
        function refreshActivity() {
          const statusNode = document.getElementById("activityStatus");
          if (statusNode) templateInto(statusNode, activityStatusBlock());
          const slot = document.getElementById("incidentSlot");
          if (slot) templateInto(slot, activityIncidentMarkup());
        }
        function refreshClassPreview() {
          const node = document.getElementById("classPreviewResult");
          if (!node) return;
          templateInto(node, state.classAdaptation.previewReady ? `<div class="compact-block"><h3>Synthetic preview ready</h3><p>The Tutor uses the selected bounded help, detail, reply-language, and topic choices. This result is not Test evidence and no class is affected.</p></div>` : `<div class="empty-state"><p>Preview not run.</p></div>`);
          const apply = document.querySelector('[data-action="review-class-apply"]');
          if (apply) apply.disabled = !state.classAdaptation.previewReady;
        }

        document.addEventListener("click", event => {
          const nav = event.target.closest("a[data-nav]");
          if (nav && event.button === 0 && !event.metaKey && !event.ctrlKey && !event.shiftKey && !event.altKey) {
            event.preventDefault();
            navigate(nav.getAttribute("href"));
            return;
          }
          const control = event.target.closest("[data-action]");
          if (!control || control.disabled) return;
          const action = control.dataset.action;
          if (action === "open-menu") {
            document.getElementById("appShell").classList.add("menu-open");
            document.getElementById("menuButton").setAttribute("aria-expanded", "true");
            window.requestAnimationFrame(() => document.querySelector(".sidebar a")?.focus());
          } else if (action === "close-menu") closeMenu();
          else if (action === "open-preview") openPreview(control.dataset.kind, true);
          else if (action === "close-preview") closePreview(true);
          else if (action === "run-preview") runPreview(control.dataset.kind);
          else if (action === "save-draft") saveDraft();
          else if (action === "discard-draft") discardDraft();
          else if (action === "run-tests" || action === "rerun-group") runTests();
          else if (action === "cancel-tests") cancelTests();
          else if (action === "request-review") requestReview();
          else if (action === "complete-review") completeReview();
          else if (action === "request-review-changes") requestReviewChanges();
          else if (action === "review-publication") showDialog(document.getElementById("publicationDialog"));
          else if (action === "publish-version") publishVersion();
          else if (action === "start-draft") openStartDraftDialog(control.dataset.version);
          else if (action === "confirm-start-draft") confirmStartDraft();
          else if (action === "cancel-dialog") closeDialog(control.closest("dialog"));
          else if (action === "ack-incident") announce("Synthetic Incident acknowledged locally. No service or backend record changed.");
          else if (action === "run-class-preview") {
            state.classAdaptation.previewReady = true;
            refreshClassPreview();
            announce("Synthetic class preview ready. No class changed.");
          } else if (action === "review-class-apply") showDialog(document.getElementById("classApplyDialog"));
          else if (action === "apply-class") {
            closeDialog(document.getElementById("classApplyDialog"));
            const previous = state.classAdaptation.appliedVersion;
            if (previous !== state.classAdaptation.version) {
              const previousVersion = state.publishedVersions.find(version => version.id === previous);
              const nextVersion = state.publishedVersions.find(version => version.id === state.classAdaptation.version);
              if (previousVersion) previousVersion.classes = Math.max(0, previousVersion.classes - 1);
              if (nextVersion) nextVersion.classes += 1;
              state.classAdaptation.appliedVersion = state.classAdaptation.version;
            }
            state.classAdaptation.applied = true;
            renderRoute();
            announce(`${state.classAdaptation.version} applied to 5 Amanah in this illustrative local state. No other class changed.`);
          }
        });

        document.addEventListener("change", event => {
          const previewControl = event.target.closest("[data-preview-field]");
          if (previewControl) {
            const kind = previewControl.dataset.previewKind;
            state.preview[kind][previewControl.dataset.previewField] = previewControl.value;
            markPreviewOutOfDate(kind);
            announce(`Preview choice changed. The previous ${kind} preview remains visible and is Out of date.`);
            return;
          }
          const draftControl = event.target.closest("[data-draft-field]");
          if (draftControl) {
            const [scope, field] = draftControl.dataset.draftField.split(".");
            if (scope === "curriculum" && field === "bundle") setCurriculumBundle(draftControl.value);
            if (scope === "teaching") {
              state.draft.teaching[field] = draftControl.value;
              const labels = { approach: "the start approach changed", detail: "response detail changed", language: "Tutor reply language changed", tone: "tone changed" };
              markDraftChanged("Teaching preferences changed", labels[field]);
            }
            announce("Draft changed locally. Test results and Educator review are Out of date; learners are not affected.");
            return;
          }
          if (event.target.matches("[data-test-preview-state]")) {
            applyTestPreviewState(event.target.value);
            return;
          }
          if (event.target.matches("[data-activity-mode]")) {
            state.activityMode = event.target.value;
            refreshActivity();
            announce(`Illustrative Activity state changed to ${event.target.options[event.target.selectedIndex].text}. This is not production monitoring.`);
            return;
          }
          const classControl = event.target.closest("[data-class-field]");
          if (classControl) {
            state.classAdaptation[classControl.dataset.classField] = classControl.value;
            state.classAdaptation.previewReady = false;
            state.classAdaptation.applied = false;
            refreshClassPreview();
            announce("Class choice changed. Run the synthetic class preview again before applying.");
          }
        });

        document.addEventListener("input", event => {
          if (!event.target.matches("[data-version-note]")) return;
          state.versionNote = event.target.value;
          refreshPublishReadiness();
        });

        document.addEventListener("keydown", event => {
          if (event.key !== "Escape") return;
          if (document.querySelector(".preview-pane.is-open")) closePreview(true);
          else if (document.getElementById("appShell").classList.contains("menu-open")) {
            closeMenu();
            document.getElementById("menuButton").focus();
          }
        });

        window.addEventListener("popstate", () => {
          const route = currentRouteFromURL();
          if (route.workspace === state.workspace && route.page === state.page) {
            if (route.preview) openPreview(route.preview, false); else closePreview(false);
            return;
          }
          state.workspace = route.workspace;
          state.page = route.page;
          renderRoute();
          closeMenu();
          focusHeading();
        });

        const initialRoute = currentRouteFromURL();
        state.workspace = initialRoute.workspace;
        state.page = initialRoute.page;
        renderRoute();
      })();
    </script>
  </body>
</html>
