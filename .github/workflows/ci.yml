name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      admin_spa: ${{ steps.filter.outputs.admin_spa }}
      backend: ${{ steps.filter.outputs.backend }}
      docker: ${{ steps.filter.outputs.docker }}
      once: ${{ steps.filter.outputs.once }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            admin_spa:
              - 'admin-spa/**'
              - '.github/workflows/ci.yml'
            backend:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - 'migrations/**'
              - 'oss/**'
              - 'deploy/docker/Dockerfile.postgres'
              - '.github/workflows/ci.yml'
            docker:
              - 'cmd/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - 'migrations/**'
              - 'oss/**'
              - 'deploy/docker/Dockerfile'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            once:
              - 'admin-spa/**'
              - 'cmd/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - 'migrations/**'
              - 'oss/**'
              - 'deploy/once/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'

  admin-spa:
    name: Admin SPA
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.admin_spa == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: admin-spa/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: admin-spa
        run: pnpm install --frozen-lockfile

      - name: Check
        working-directory: admin-spa
        run: pnpm check

  admin-spa-e2e:
    name: Admin SPA backend E2E
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.admin_spa == 'true' ||
      needs.changes.outputs.backend == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: admin-spa/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Start PostgreSQL and Dragonfly
        run: docker compose up --build --detach --wait postgres dragonfly

      - name: Install admin SPA dependencies
        working-directory: admin-spa
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: admin-spa
        run: pnpm exec playwright install --with-deps chromium

      - name: Run database migrations
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.26.0 -dir migrations postgres "postgres://pai:pai@localhost:5432/pai?sslmode=disable" up -allow-missing

      - name: Build Go backend
        run: go build -o pai-bot ./cmd/server

      - name: Start Go backend
        run: |
          ./pai-bot > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              echo "Backend healthy after attempt $attempt"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/backend.pid)" 2>/dev/null; then
              cat /tmp/backend.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/backend.log
          exit 1
        env:
          LEARN_SERVER_HOST: 0.0.0.0
          LEARN_SERVER_PORT: "8080"
          LEARN_DATABASE_URL: postgres://pai:pai@localhost:5432/pai?sslmode=disable
          LEARN_CACHE_URL: redis://localhost:6379
          LEARN_TENANT_MODE: single
          LEARN_CURRICULUM_PATH: ./oss
          LEARN_DEV_MODE: "true"
          LEARN_LOG_LEVEL: warn
          LEARN_LOG_FORMAT: text
          PAI_AUTH_SECRET: ci-test-secret
          PAI_AUTH_BOOTSTRAP_ADMIN_EMAIL: admin@example.com
          PAI_AUTH_BOOTSTRAP_ADMIN_PASSWORD: demo-password

      - name: Run public browser tests
        working-directory: admin-spa
        run: pnpm test:e2e

      - name: Run authenticated browser tests
        working-directory: admin-spa
        run: pnpm test:e2e:backend
        env:
          E2E_BACKEND_ENABLED: "true"
          E2E_ADMIN_EMAIL: admin@example.com
          E2E_ADMIN_PASSWORD: demo-password

      - name: Dump backend logs
        if: failure()
        run: cat /tmp/backend.log || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-spa-playwright-report
          path: |
            admin-spa/playwright-report
            admin-spa/test-results
          if-no-files-found: ignore

  go:
    name: Go ${{ matrix.check }}
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: vet
            command: go vet ./...
          - check: test
            command: go test ./... -count=1
          - check: focused-page integration
            command: go test -tags=integration ./internal/focusedpage -count=1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download dependencies
        run: go mod download

      - name: Run ${{ matrix.check }}
        run: ${{ matrix.command }}

  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4.0

  docker:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.docker == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          tags: pai-bot:ci
          cache-from: type=gha,scope=ci-app
          cache-to: type=gha,mode=max,scope=ci-app

  once:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.once == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: docker/setup-buildx-action@v3

      - name: Build ONCE image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/once/Dockerfile
          push: false
          tags: pai-bot-once:ci
          cache-from: type=gha,scope=ci-once
          cache-to: type=gha,mode=max,scope=ci-once
