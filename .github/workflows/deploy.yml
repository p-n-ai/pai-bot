name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: admin-spa/pnpm-lock.yaml

      - name: Install admin SPA dependencies
        working-directory: admin-spa
        run: pnpm install --frozen-lockfile

      - name: Check admin SPA
        working-directory: admin-spa
        run: pnpm check

      - name: Install Playwright browser
        working-directory: admin-spa
        run: pnpm exec playwright install --with-deps chromium

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download Go dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -short -count=1

      - name: Start PostgreSQL and Dragonfly
        run: docker compose up --build --detach --wait postgres dragonfly

      - name: Run database migrations
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.26.0 -dir migrations postgres "postgres://pai:pai@localhost:5432/pai?sslmode=disable" up -allow-missing

      - name: Build Go backend
        run: go build -o pai-bot ./cmd/server

      - name: Start Go backend
        run: |
          ./pai-bot > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              echo "Backend healthy after attempt $attempt"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/backend.pid)" 2>/dev/null; then
              cat /tmp/backend.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/backend.log
          exit 1
        env:
          LEARN_SERVER_HOST: 0.0.0.0
          LEARN_SERVER_PORT: "8080"
          LEARN_DATABASE_URL: postgres://pai:pai@localhost:5432/pai?sslmode=disable
          LEARN_CACHE_URL: redis://localhost:6379
          LEARN_TENANT_MODE: single
          LEARN_CURRICULUM_PATH: ./oss
          LEARN_DEV_MODE: "true"
          LEARN_LOG_LEVEL: warn
          LEARN_LOG_FORMAT: text
          PAI_AUTH_SECRET: deploy-test-secret
          PAI_AUTH_BOOTSTRAP_ADMIN_EMAIL: admin@example.com
          PAI_AUTH_BOOTSTRAP_ADMIN_PASSWORD: demo-password

      - name: Run public browser tests
        working-directory: admin-spa
        run: pnpm test:e2e

      - name: Run authenticated browser tests
        working-directory: admin-spa
        run: pnpm test:e2e:backend
        env:
          E2E_BACKEND_ENABLED: "true"
          E2E_ADMIN_EMAIL: admin@example.com
          E2E_ADMIN_PASSWORD: demo-password

      - name: Dump backend logs
        if: failure()
        run: cat /tmp/backend.log || true

  push-images:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      ecr-token: ${{ steps.ecr-token.outputs.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push app image
        run: |
          docker build -f deploy/docker/Dockerfile \
            -t ${{ secrets.ECR_REGISTRY }}/pai-bot/app:${{ github.sha }} \
            -t ${{ secrets.ECR_REGISTRY }}/pai-bot/app:latest .
          docker push ${{ secrets.ECR_REGISTRY }}/pai-bot/app:${{ github.sha }}
          docker push ${{ secrets.ECR_REGISTRY }}/pai-bot/app:latest

      - name: Build and push admin image
        run: |
          docker build -f deploy/docker/Dockerfile.admin \
            -t ${{ secrets.ECR_REGISTRY }}/pai-bot/admin:${{ github.sha }} \
            -t ${{ secrets.ECR_REGISTRY }}/pai-bot/admin:latest .
          docker push ${{ secrets.ECR_REGISTRY }}/pai-bot/admin:${{ github.sha }}
          docker push ${{ secrets.ECR_REGISTRY }}/pai-bot/admin:latest

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PostgreSQL retrieval image
        run: |
          docker build -f deploy/docker/Dockerfile.postgres \
            -t ghcr.io/p-n-ai/pai-postgres:pggraph-1.0.0-pgvector-0.8.5 .
          docker push ghcr.io/p-n-ai/pai-postgres:pggraph-1.0.0-pgvector-0.8.5

      - name: Generate ECR token for server
        id: ecr-token
        run: |
          TOKEN=$(aws ecr get-login-password --region ${{ secrets.AWS_REGION }})
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: push-images
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml,deploy/caddy,deploy/docker/Dockerfile.postgres,migrations,scripts/deploy-remote.sh,scripts/preflight-conversation-identities.sql"
          target: ${{ secrets.DEPLOY_DIR }}
          strip_components: 0

      - name: Write .env on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: DEPLOY_DIR,PG_PASS,TG_TOKEN,AUTH_SECRET,OPENAI_KEY,ANTHROPIC_KEY,DEEPSEEK_KEY,GOOGLE_KEY,OPENROUTER_KEY,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_ALLOWED_DOMAIN,SMTP_ADDR,SMTP_USER,SMTP_PASS,SMTP_FROM,SMTP_NAME,DOMAIN_VAL
          script: |
            cd "$DEPLOY_DIR"
            printf '%s\n' \
              "LEARN_SERVER_PORT=8080" \
              "LEARN_DATABASE_URL=postgres://pai:${PG_PASS}@postgres:5432/pai?sslmode=disable" \
              "LEARN_DATABASE_MAX_CONNS=25" \
              "LEARN_CACHE_URL=redis://dragonfly:6379" \
              "LEARN_TELEGRAM_BOT_TOKEN=${TG_TOKEN}" \
              "PAI_AUTH_SECRET=${AUTH_SECRET}" \
              "PAI_AUTH_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" \
              "PAI_AUTH_GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}" \
              "PAI_AUTH_GOOGLE_ALLOWED_DOMAIN=${GOOGLE_ALLOWED_DOMAIN}" \
              "LEARN_AI_OPENAI_API_KEY=${OPENAI_KEY}" \
              "LEARN_AI_ANTHROPIC_API_KEY=${ANTHROPIC_KEY}" \
              "LEARN_AI_DEEPSEEK_API_KEY=${DEEPSEEK_KEY}" \
              "LEARN_AI_GOOGLE_API_KEY=${GOOGLE_KEY}" \
              "LEARN_AI_OPENROUTER_API_KEY=${OPENROUTER_KEY}" \
              "LEARN_AI_CODEX_ENABLED=true" \
              "LEARN_AI_CODEX_HOME=/var/lib/pai-bot/codex" \
              "LEARN_AI_CODEX_MODEL=gpt-5.4" \
              "LEARN_AI_OLLAMA_ENABLED=false" \
              "LEARN_TENANT_MODE=single" \
              "LEARN_CURRICULUM_PATH=./oss" \
              "LEARN_DISABLE_MULTI_LANGUAGE=false" \
              "LEARN_RATING_PROMPT_EVERY_REPLIES=5" \
              "LEARN_AI_PERSONALIZED_NUDGES_ENABLED=true" \
              "LEARN_EMAIL_SMTP_ADDR=${SMTP_ADDR}" \
              "LEARN_EMAIL_SMTP_USERNAME=${SMTP_USER}" \
              "LEARN_EMAIL_SMTP_PASSWORD=${SMTP_PASS}" \
              "LEARN_EMAIL_FROM_ADDRESS=${SMTP_FROM}" \
              "LEARN_EMAIL_FROM_NAME=${SMTP_NAME}" \
              "LEARN_LOG_LEVEL=info" \
              "LEARN_LOG_FORMAT=json" \
              "POSTGRES_PASSWORD=${PG_PASS}" \
              > .env
            chmod 600 .env

            if [ -n "${OPENAI_KEY}" ]; then
              printf '%s\n' \
                "LEARN_RETRIEVAL_EMBEDDING_BASE_URL=https://api.openai.com/v1" \
                "LEARN_RETRIEVAL_EMBEDDING_API_KEY=${OPENAI_KEY}" \
                "LEARN_RETRIEVAL_EMBEDDING_MODEL=text-embedding-3-small" \
                "LEARN_RETRIEVAL_EMBEDDING_DIMENSIONS=1536" \
                >> .env
            fi

            if [ -n "${DOMAIN_VAL}" ] && [ "${DOMAIN_VAL}" != "localhost" ]; then
              echo "DOMAIN=${DOMAIN_VAL}" >> .env
              cp deploy/caddy/Caddyfile.https deploy/caddy/Caddyfile
            else
              cp deploy/caddy/Caddyfile.http deploy/caddy/Caddyfile
            fi
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          PG_PASS: ${{ secrets.POSTGRES_PASSWORD }}
          TG_TOKEN: ${{ secrets.LEARN_TELEGRAM_BOT_TOKEN }}
          AUTH_SECRET: ${{ secrets.PAI_AUTH_SECRET }}
          OPENAI_KEY: ${{ secrets.LEARN_AI_OPENAI_API_KEY }}
          ANTHROPIC_KEY: ${{ secrets.LEARN_AI_ANTHROPIC_API_KEY }}
          DEEPSEEK_KEY: ${{ secrets.LEARN_AI_DEEPSEEK_API_KEY }}
          GOOGLE_KEY: ${{ secrets.LEARN_AI_GOOGLE_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.LEARN_AI_OPENROUTER_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.PAI_AUTH_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.PAI_AUTH_GOOGLE_CLIENT_SECRET }}
          GOOGLE_ALLOWED_DOMAIN: ${{ secrets.PAI_AUTH_GOOGLE_ALLOWED_DOMAIN }}
          SMTP_ADDR: ${{ secrets.LEARN_EMAIL_SMTP_ADDR }}
          SMTP_USER: ${{ secrets.LEARN_EMAIL_SMTP_USERNAME }}
          SMTP_PASS: ${{ secrets.LEARN_EMAIL_SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.LEARN_EMAIL_FROM_ADDRESS }}
          SMTP_NAME: ${{ secrets.LEARN_EMAIL_FROM_NAME }}
          DOMAIN_VAL: ${{ secrets.DOMAIN }}

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: DEPLOY_DIR,ECR_TOKEN,REGISTRY,TAG
          script: |
            chmod +x "$DEPLOY_DIR/scripts/deploy-remote.sh"
            DEPLOY_DIR="$DEPLOY_DIR" ECR_TOKEN="$ECR_TOKEN" REGISTRY="$REGISTRY" TAG="$TAG" \
              "$DEPLOY_DIR/scripts/deploy-remote.sh"
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          ECR_TOKEN: ${{ needs.push-images.outputs.ecr-token }}
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          TAG: ${{ github.sha }}
