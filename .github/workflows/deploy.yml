name: Deploy

on:
  workflow_call:
    inputs:
      admin_changed:
        required: true
        type: boolean
      app_changed:
        required: true
        type: boolean
      deployable:
        required: true
        type: boolean
      postgres_changed:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      rebuild_postgres:
        description: Build PostgreSQL when this SHA has no recorded image
        required: true
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  push-images:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || inputs.deployable
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      ecr-token: ${{ steps.ecr-token.outputs.token }}
      postgres-image: ${{ steps.postgres-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        if: >-
          github.event_name == 'workflow_dispatch' ||
          inputs.app_changed
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/pai-bot/app:${{ github.sha }}
            ${{ secrets.ECR_REGISTRY }}/pai-bot/app:latest
          cache-from: type=gha,scope=deploy-app
          cache-to: type=gha,mode=max,scope=deploy-app

      - name: Promote existing app image to deployment SHA
        if: >-
          github.event_name != 'workflow_dispatch' &&
          inputs.app_changed == false
        run: |
          docker buildx imagetools create \
            --tag "${{ secrets.ECR_REGISTRY }}/pai-bot/app:${{ github.sha }}" \
            "${{ secrets.ECR_REGISTRY }}/pai-bot/app:latest"

      - name: Build and push admin image
        if: >-
          github.event_name == 'workflow_dispatch' ||
          inputs.admin_changed
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.admin
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/pai-bot/admin:${{ github.sha }}
            ${{ secrets.ECR_REGISTRY }}/pai-bot/admin:latest
          cache-from: type=gha,scope=deploy-admin
          cache-to: type=gha,mode=max,scope=deploy-admin

      - name: Promote existing admin image to deployment SHA
        if: >-
          github.event_name != 'workflow_dispatch' &&
          inputs.admin_changed == false
        run: |
          docker buildx imagetools create \
            --tag "${{ secrets.ECR_REGISTRY }}/pai-bot/admin:${{ github.sha }}" \
            "${{ secrets.ECR_REGISTRY }}/pai-bot/admin:latest"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve recorded PostgreSQL image
        id: recorded-postgres
        env:
          DEPLOYMENT_TAG: ghcr.io/p-n-ai/pai-postgres:${{ github.sha }}
        run: |
          if manifest=$(docker buildx imagetools inspect "$DEPLOYMENT_TAG" 2> /dev/null); then
            digest=$(printf '%s\n' "$manifest" | awk '$1 == "Digest:" { print $2; exit }')
            case "$digest" in
              sha256:*) ;;
              *) echo "Invalid recorded PostgreSQL image digest: $digest" >&2; exit 1 ;;
            esac
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push PostgreSQL retrieval image
        id: build-postgres
        if: >-
          steps.recorded-postgres.outputs.exists != 'true' &&
          (inputs.postgres_changed ||
           (github.event_name == 'workflow_dispatch' &&
            inputs.rebuild_postgres))
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.postgres
          push: true
          tags: ghcr.io/p-n-ai/pai-postgres:pggraph-1.0.0-pgvector-0.8.5
          cache-from: type=gha,scope=deploy-postgres
          cache-to: type=gha,mode=max,scope=deploy-postgres

      - name: Resolve immutable PostgreSQL image
        id: postgres-image
        env:
          BUILT_DIGEST: ${{ steps.build-postgres.outputs.digest }}
          RECORDED_DIGEST: ${{ steps.recorded-postgres.outputs.digest }}
        run: |
          digest="$BUILT_DIGEST"
          [ -n "$digest" ] || digest="$RECORDED_DIGEST"
          if [ -z "$digest" ]; then
            digest=$(
              docker buildx imagetools inspect \
                ghcr.io/p-n-ai/pai-postgres:pggraph-1.0.0-pgvector-0.8.5 |
                awk '$1 == "Digest:" { print $2; exit }'
            )
          fi
          case "$digest" in
            sha256:*) ;;
            *) echo "Invalid PostgreSQL image digest: $digest" >&2; exit 1 ;;
          esac
          echo "image=ghcr.io/p-n-ai/pai-postgres@$digest" >> "$GITHUB_OUTPUT"

      - name: Record PostgreSQL image for deployment SHA
        id: record-postgres
        env:
          DEPLOYMENT_TAG: ghcr.io/p-n-ai/pai-postgres:${{ github.sha }}
          POSTGRES_IMAGE: ${{ steps.postgres-image.outputs.image }}
          RECORDED: ${{ steps.recorded-postgres.outputs.exists }}
          REBUILT: ${{ steps.build-postgres.outcome == 'success' }}
        run: |
          if [ "$RECORDED" = "true" ]; then
            action=reused
          else
            docker buildx imagetools create \
              --tag "$DEPLOYMENT_TAG" \
              "$POSTGRES_IMAGE"
            [ "$REBUILT" = "true" ] && action=rebuilt || action=promoted
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Record image-build metrics
        env:
          ADMIN_CHANGED: ${{ inputs.admin_changed }}
          APP_CHANGED: ${{ inputs.app_changed }}
          POSTGRES_IMAGE: ${{ steps.postgres-image.outputs.image }}
          POSTGRES_ACTION: ${{ steps.record-postgres.outputs.action }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            admin_action=rebuilt
            app_action=rebuilt
          else
            [ "$ADMIN_CHANGED" = "true" ] && admin_action=rebuilt || admin_action=promoted
            [ "$APP_CHANGED" = "true" ] && app_action=rebuilt || app_action=promoted
          fi
          {
            echo "### Image build plan"
            echo "| Image | Action |"
            echo "| --- | --- |"
            echo "| App | $app_action |"
            echo "| Admin | $admin_action |"
            echo "| PostgreSQL | $POSTGRES_ACTION |"
            echo
            echo "PostgreSQL deployment image: \`$POSTGRES_IMAGE\`"
            echo
            echo "Build duration and combined runner time are available from this run's job and step timings."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate ECR token for server
        id: ecr-token
        run: |
          TOKEN=$(aws ecr get-login-password --region ${{ secrets.AWS_REGION }})
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: push-images
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml,deploy/caddy,deploy/docker/Dockerfile.postgres,migrations,scripts/deploy-remote.sh,scripts/preflight-conversation-identities.sql"
          target: ${{ secrets.DEPLOY_DIR }}
          strip_components: 0

      - name: Write .env on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: DEPLOY_DIR,PG_PASS,TG_TOKEN,AUTH_SECRET,OPENAI_KEY,ANTHROPIC_KEY,DEEPSEEK_KEY,GOOGLE_KEY,OPENROUTER_KEY,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_ALLOWED_DOMAIN,SMTP_ADDR,SMTP_USER,SMTP_PASS,SMTP_FROM,SMTP_NAME,DOMAIN_VAL,FEATURES,AI_HEALTH_TOKEN
          script: |
            cd "$DEPLOY_DIR"
            printf '%s\n' \
              "LEARN_SERVER_PORT=8080" \
              "LEARN_DATABASE_URL=postgres://pai:${PG_PASS}@postgres:5432/pai?sslmode=disable" \
              "LEARN_DATABASE_MAX_CONNS=25" \
              "LEARN_CACHE_URL=redis://dragonfly:6379" \
              "LEARN_TELEGRAM_BOT_TOKEN=${TG_TOKEN}" \
              "PAI_AUTH_SECRET=${AUTH_SECRET}" \
              "PAI_AUTH_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" \
              "PAI_AUTH_GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}" \
              "PAI_AUTH_GOOGLE_ALLOWED_DOMAIN=${GOOGLE_ALLOWED_DOMAIN}" \
              "LEARN_AI_OPENAI_API_KEY=${OPENAI_KEY}" \
              "LEARN_AI_ANTHROPIC_API_KEY=${ANTHROPIC_KEY}" \
              "LEARN_AI_DEEPSEEK_API_KEY=${DEEPSEEK_KEY}" \
              "LEARN_AI_GOOGLE_API_KEY=${GOOGLE_KEY}" \
              "LEARN_AI_OPENROUTER_API_KEY=${OPENROUTER_KEY}" \
              "LEARN_AI_CODEX_ENABLED=true" \
              "LEARN_AI_CODEX_HOME=/var/lib/pai-bot/codex" \
              "LEARN_AI_CODEX_MODEL=gpt-5.4" \
              "LEARN_AI_OLLAMA_ENABLED=false" \
              "LEARN_TENANT_MODE=single" \
              "LEARN_CURRICULUM_PATH=./oss" \
              "PAI_FEATURES=${FEATURES}" \
              "PAI_AI_HEALTH_TOKEN=${AI_HEALTH_TOKEN}" \
              "LEARN_DISABLE_MULTI_LANGUAGE=false" \
              "LEARN_RATING_PROMPT_EVERY_REPLIES=5" \
              "LEARN_AI_PERSONALIZED_NUDGES_ENABLED=true" \
              "LEARN_EMAIL_SMTP_ADDR=${SMTP_ADDR}" \
              "LEARN_EMAIL_SMTP_USERNAME=${SMTP_USER}" \
              "LEARN_EMAIL_SMTP_PASSWORD=${SMTP_PASS}" \
              "LEARN_EMAIL_FROM_ADDRESS=${SMTP_FROM}" \
              "LEARN_EMAIL_FROM_NAME=${SMTP_NAME}" \
              "LEARN_LOG_LEVEL=info" \
              "LEARN_LOG_FORMAT=json" \
              "POSTGRES_PASSWORD=${PG_PASS}" \
              > .env
            chmod 600 .env

            if [ -n "${OPENAI_KEY}" ]; then
              printf '%s\n' \
                "LEARN_RETRIEVAL_EMBEDDING_BASE_URL=https://api.openai.com/v1" \
                "LEARN_RETRIEVAL_EMBEDDING_API_KEY=${OPENAI_KEY}" \
                "LEARN_RETRIEVAL_EMBEDDING_MODEL=text-embedding-3-small" \
                "LEARN_RETRIEVAL_EMBEDDING_DIMENSIONS=1536" \
                >> .env
            fi

            if [ -n "${DOMAIN_VAL}" ] && [ "${DOMAIN_VAL}" != "localhost" ]; then
              echo "DOMAIN=${DOMAIN_VAL}" >> .env
              cp deploy/caddy/Caddyfile.https deploy/caddy/Caddyfile
            else
              cp deploy/caddy/Caddyfile.http deploy/caddy/Caddyfile
            fi
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          PG_PASS: ${{ secrets.POSTGRES_PASSWORD }}
          TG_TOKEN: ${{ secrets.LEARN_TELEGRAM_BOT_TOKEN }}
          AUTH_SECRET: ${{ secrets.PAI_AUTH_SECRET }}
          OPENAI_KEY: ${{ secrets.LEARN_AI_OPENAI_API_KEY }}
          ANTHROPIC_KEY: ${{ secrets.LEARN_AI_ANTHROPIC_API_KEY }}
          DEEPSEEK_KEY: ${{ secrets.LEARN_AI_DEEPSEEK_API_KEY }}
          GOOGLE_KEY: ${{ secrets.LEARN_AI_GOOGLE_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.LEARN_AI_OPENROUTER_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.PAI_AUTH_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.PAI_AUTH_GOOGLE_CLIENT_SECRET }}
          GOOGLE_ALLOWED_DOMAIN: ${{ secrets.PAI_AUTH_GOOGLE_ALLOWED_DOMAIN }}
          SMTP_ADDR: ${{ secrets.LEARN_EMAIL_SMTP_ADDR }}
          SMTP_USER: ${{ secrets.LEARN_EMAIL_SMTP_USERNAME }}
          SMTP_PASS: ${{ secrets.LEARN_EMAIL_SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.LEARN_EMAIL_FROM_ADDRESS }}
          SMTP_NAME: ${{ secrets.LEARN_EMAIL_FROM_NAME }}
          DOMAIN_VAL: ${{ secrets.DOMAIN }}
          FEATURES: ${{ vars.PAI_FEATURES }}
          AI_HEALTH_TOKEN: ${{ secrets.PAI_AI_HEALTH_TOKEN }}

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: DEPLOY_DIR,ECR_TOKEN,GHCR_TOKEN,GHCR_USER,POSTGRES_IMAGE,REGISTRY,TAG
          script: |
            chmod +x "$DEPLOY_DIR/scripts/deploy-remote.sh"
            DEPLOY_DIR="$DEPLOY_DIR" ECR_TOKEN="$ECR_TOKEN" GHCR_TOKEN="$GHCR_TOKEN" \
              GHCR_USER="$GHCR_USER" POSTGRES_IMAGE="$POSTGRES_IMAGE" \
              REGISTRY="$REGISTRY" TAG="$TAG" \
              "$DEPLOY_DIR/scripts/deploy-remote.sh"
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          ECR_TOKEN: ${{ needs.push-images.outputs.ecr-token }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          POSTGRES_IMAGE: ${{ needs.push-images.outputs.postgres-image }}
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          TAG: ${{ github.sha }}
