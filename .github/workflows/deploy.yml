name: Deploy candidate

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      app_digest:
        required: true
        type: string
      admin_digest:
        required: true
        type: string
      postgres_image:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
          submodules: true

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify candidate images
        env:
          APP_DIGEST: ${{ inputs.app_digest }}
          ADMIN_DIGEST: ${{ inputs.admin_digest }}
        run: |
          aws ecr batch-get-image \
            --repository-name pai-bot/app \
            --image-ids imageDigest="$APP_DIGEST" \
            --query 'length(images)' \
            --output text | grep -qx 1
          aws ecr batch-get-image \
            --repository-name pai-bot/admin \
            --image-ids imageDigest="$ADMIN_DIGEST" \
            --query 'length(images)' \
            --output text | grep -qx 1

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify PostgreSQL candidate image
        env:
          POSTGRES_IMAGE: ${{ inputs.postgres_image }}
        run: docker manifest inspect "$POSTGRES_IMAGE" > /dev/null

      - name: Validate production secrets
        run: go run ./cmd/validate-production-secrets
        env:
          PAI_AUTH_SECRET: ${{ secrets.PAI_AUTH_SECRET || secrets.LEARN_AUTH_JWT_SECRET }}
          PAI_CONFIG_ENCRYPTION_KEY: ${{ secrets.PAI_CONFIG_ENCRYPTION_KEY }}
          PAI_CONFIG_PREVIOUS_ENCRYPTION_KEYS: ${{ secrets.PAI_CONFIG_PREVIOUS_ENCRYPTION_KEYS }}
          PAI_AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.PAI_AUTH_BOOTSTRAP_ADMIN_PASSWORD }}

      - name: Copy files to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml,deploy/caddy,deploy/docker/Dockerfile.postgres,migrations,scripts/deploy-remote.sh,scripts/preflight-conversation-identities.sql"
          target: ${{ secrets.DEPLOY_DIR }}
          strip_components: 0

      - name: Write .env on server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: DEPLOY_DIR,PG_PASS,TG_TOKEN,AUTH_SECRET,CONFIG_ENCRYPTION_KEY,PREVIOUS_CONFIG_ENCRYPTION_KEYS,BOOTSTRAP_ADMIN_EMAIL,BOOTSTRAP_ADMIN_PASSWORD,OPENAI_KEY,ANTHROPIC_KEY,DEEPSEEK_KEY,GOOGLE_KEY,OPENROUTER_KEY,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_ALLOWED_DOMAIN,SMTP_ADDR,SMTP_USER,SMTP_PASS,SMTP_FROM,SMTP_NAME,DOMAIN_VAL,FEATURES
          script: |
            cd "$DEPLOY_DIR"
            PREVIOUS_CONFIG_ENCRYPTION_KEYS="${PREVIOUS_CONFIG_ENCRYPTION_KEYS:-[]}"
            case "${PG_PASS}${TG_TOKEN}${AUTH_SECRET}${CONFIG_ENCRYPTION_KEY}${PREVIOUS_CONFIG_ENCRYPTION_KEYS}${BOOTSTRAP_ADMIN_EMAIL}${BOOTSTRAP_ADMIN_PASSWORD}${OPENAI_KEY}${ANTHROPIC_KEY}${DEEPSEEK_KEY}${GOOGLE_KEY}${OPENROUTER_KEY}${GOOGLE_CLIENT_ID}${GOOGLE_CLIENT_SECRET}${GOOGLE_ALLOWED_DOMAIN}${SMTP_ADDR}${SMTP_USER}${SMTP_PASS}${SMTP_FROM}${SMTP_NAME}${DOMAIN_VAL}${FEATURES}" in
              *$'\n'*|*$'\r'*)
                echo "deployment values must not contain newlines" >&2
                exit 1
                ;;
            esac
            case "${PG_PASS}" in
              *[!A-Za-z0-9._~-]*)
                echo "POSTGRES_PASSWORD must use URL-safe characters" >&2
                exit 1
                ;;
            esac
            umask 077
            env_tmp="$(mktemp .env.tmp.XXXXXX)"
            trap 'rm -f "$env_tmp" "${rollback_tmp:-}"' EXIT
            printf '%s\n' \
              "LEARN_SERVER_PORT=8080" \
              "LEARN_DATABASE_URL=postgres://pai:${PG_PASS}@postgres:5432/pai?sslmode=disable" \
              "LEARN_DATABASE_MAX_CONNS=25" \
              "LEARN_CACHE_URL=redis://dragonfly:6379" \
              "LEARN_TELEGRAM_BOT_TOKEN=${TG_TOKEN}" \
              "PAI_AUTH_SECRET=${AUTH_SECRET}" \
              "PAI_CONFIG_ENCRYPTION_KEY=${CONFIG_ENCRYPTION_KEY}" \
              "PAI_CONFIG_PREVIOUS_ENCRYPTION_KEYS=${PREVIOUS_CONFIG_ENCRYPTION_KEYS}" \
              "PAI_AUTH_BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL}" \
              "PAI_AUTH_BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD}" \
              "PAI_AUTH_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" \
              "PAI_AUTH_GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}" \
              "PAI_AUTH_GOOGLE_ALLOWED_DOMAIN=${GOOGLE_ALLOWED_DOMAIN}" \
              "LEARN_AI_DEFAULT_PROVIDER=codex" \
              "LEARN_AI_OPENAI_API_KEY=${OPENAI_KEY}" \
              "LEARN_AI_ANTHROPIC_API_KEY=${ANTHROPIC_KEY}" \
              "LEARN_AI_DEEPSEEK_API_KEY=${DEEPSEEK_KEY}" \
              "LEARN_AI_GOOGLE_API_KEY=${GOOGLE_KEY}" \
              "LEARN_AI_OPENROUTER_API_KEY=${OPENROUTER_KEY}" \
              "LEARN_AI_CODEX_ENABLED=true" \
              "LEARN_AI_CODEX_HOME=/var/lib/pai-bot/codex" \
              "LEARN_AI_CODEX_MODEL=gpt-5.4" \
              "LEARN_AI_OLLAMA_ENABLED=false" \
              "LEARN_TENANT_MODE=single" \
              "LEARN_CURRICULUM_PATH=./oss" \
              "PAI_FEATURES=${FEATURES}" \
              "LEARN_DISABLE_MULTI_LANGUAGE=false" \
              "LEARN_RATING_PROMPT_EVERY_REPLIES=5" \
              "LEARN_AI_PERSONALIZED_NUDGES_ENABLED=true" \
              "LEARN_EMAIL_SMTP_ADDR=${SMTP_ADDR}" \
              "LEARN_EMAIL_SMTP_USERNAME=${SMTP_USER}" \
              "LEARN_EMAIL_SMTP_PASSWORD=${SMTP_PASS}" \
              "LEARN_EMAIL_FROM_ADDRESS=${SMTP_FROM}" \
              "LEARN_EMAIL_FROM_NAME=${SMTP_NAME}" \
              "LEARN_LOG_LEVEL=info" \
              "LEARN_LOG_FORMAT=json" \
              "POSTGRES_PASSWORD=${PG_PASS}" \
              > "$env_tmp"

            if [ -n "${OPENAI_KEY}" ]; then
              printf '%s\n' \
                "LEARN_RETRIEVAL_EMBEDDING_BASE_URL=https://api.openai.com/v1" \
                "LEARN_RETRIEVAL_EMBEDDING_API_KEY=${OPENAI_KEY}" \
                "LEARN_RETRIEVAL_EMBEDDING_MODEL=text-embedding-3-small" \
                "LEARN_RETRIEVAL_EMBEDDING_DIMENSIONS=1536" \
                >> "$env_tmp"
            fi

            if [ -n "${DOMAIN_VAL}" ] && [ "${DOMAIN_VAL}" != "localhost" ]; then
              printf '%s\n' "DOMAIN=${DOMAIN_VAL}" >> "$env_tmp"
              cp deploy/caddy/Caddyfile.https deploy/caddy/Caddyfile
            else
              cp deploy/caddy/Caddyfile.http deploy/caddy/Caddyfile
            fi
            chmod 600 "$env_tmp"
            if [ -f .env ]; then
              rollback_tmp="$(mktemp .env.rollback.tmp.XXXXXX)"
              cp .env "$rollback_tmp"
              chmod 600 "$rollback_tmp"
              mv "$rollback_tmp" .env.rollback
            fi
            mv "$env_tmp" .env
            trap - EXIT
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          PG_PASS: ${{ secrets.POSTGRES_PASSWORD }}
          TG_TOKEN: ${{ secrets.LEARN_TELEGRAM_BOT_TOKEN }}
          AUTH_SECRET: ${{ secrets.PAI_AUTH_SECRET || secrets.LEARN_AUTH_JWT_SECRET }}
          CONFIG_ENCRYPTION_KEY: ${{ secrets.PAI_CONFIG_ENCRYPTION_KEY }}
          PREVIOUS_CONFIG_ENCRYPTION_KEYS: ${{ secrets.PAI_CONFIG_PREVIOUS_ENCRYPTION_KEYS }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.PAI_AUTH_BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.PAI_AUTH_BOOTSTRAP_ADMIN_PASSWORD }}
          OPENAI_KEY: ${{ secrets.LEARN_AI_OPENAI_API_KEY }}
          ANTHROPIC_KEY: ${{ secrets.LEARN_AI_ANTHROPIC_API_KEY }}
          DEEPSEEK_KEY: ${{ secrets.LEARN_AI_DEEPSEEK_API_KEY }}
          GOOGLE_KEY: ${{ secrets.LEARN_AI_GOOGLE_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.LEARN_AI_OPENROUTER_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.PAI_AUTH_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.PAI_AUTH_GOOGLE_CLIENT_SECRET }}
          GOOGLE_ALLOWED_DOMAIN: ${{ secrets.PAI_AUTH_GOOGLE_ALLOWED_DOMAIN }}
          SMTP_ADDR: ${{ secrets.LEARN_EMAIL_SMTP_ADDR }}
          SMTP_USER: ${{ secrets.LEARN_EMAIL_SMTP_USERNAME }}
          SMTP_PASS: ${{ secrets.LEARN_EMAIL_SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.LEARN_EMAIL_FROM_ADDRESS }}
          SMTP_NAME: ${{ secrets.LEARN_EMAIL_FROM_NAME }}
          DOMAIN_VAL: ${{ secrets.DOMAIN }}
          FEATURES: ${{ vars.PAI_FEATURES }}

      - name: Generate masked ECR token for server
        run: |
          ecr_token=$(aws ecr get-login-password --region "${{ secrets.AWS_REGION }}")
          echo "::add-mask::$ecr_token"
          echo "ECR_TOKEN=$ecr_token" >> "$GITHUB_ENV"

      - name: Deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: DEPLOY_DIR,ECR_TOKEN,GHCR_TOKEN,GHCR_USER,POSTGRES_IMAGE,REGISTRY,TAG,APP_DIGEST,ADMIN_DIGEST
          script: |
            chmod +x "$DEPLOY_DIR/scripts/deploy-remote.sh"
            DEPLOY_DIR="$DEPLOY_DIR" ECR_TOKEN="$ECR_TOKEN" GHCR_TOKEN="$GHCR_TOKEN" \
              GHCR_USER="$GHCR_USER" POSTGRES_IMAGE="$POSTGRES_IMAGE" \
              REGISTRY="$REGISTRY" TAG="$TAG" APP_DIGEST="$APP_DIGEST" \
              ADMIN_DIGEST="$ADMIN_DIGEST" \
              "$DEPLOY_DIR/scripts/deploy-remote.sh"
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          POSTGRES_IMAGE: ${{ inputs.postgres_image }}
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          TAG: ${{ inputs.sha }}
          APP_DIGEST: ${{ inputs.app_digest }}
          ADMIN_DIGEST: ${{ inputs.admin_digest }}
