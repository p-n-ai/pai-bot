name: Nightly candidate

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: nightly-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: true

      - name: Reuse completed candidate artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq "[.artifacts[] | select(.name == \"nightly-candidate-$SHA\" and .expired == false)] | length")
          if [ "$count" -gt 1 ]; then
            echo "multiple candidate artifacts already exist for $SHA" >&2
            exit 1
          fi
          if [ "$count" -eq 1 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Candidate artifact already exists; this rerun is a no-op"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore completed candidate metadata
        if: steps.artifact.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          gh run download "$GITHUB_RUN_ID"
          --name "nightly-candidate-$SHA"
          --dir .

      - name: Configure AWS credentials
        if: steps.artifact.outputs.exists != 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        if: steps.artifact.outputs.exists != 'true'
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Login to GHCR
        if: steps.artifact.outputs.exists != 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.artifact.outputs.exists != 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Resolve PostgreSQL candidate
        if: steps.artifact.outputs.exists != 'true'
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          deployment_tag="ghcr.io/p-n-ai/pai-postgres:$SHA"
          resolve_digest() {
            docker buildx imagetools inspect "$1" 2> /dev/null |
              awk '$1 == "Digest:" { print $2; exit }'
          }
          digest=$(resolve_digest "$deployment_tag" || true)
          if [[ "$digest" != sha256:* ]]; then
            base_image=$(
              docker compose config --variables |
                awk '$1 == "POSTGRES_IMAGE" { print $3; exit }'
            )
            source_image=""
            for candidate in \
              ghcr.io/p-n-ai/pai-postgres:deployed \
              "$base_image"
            do
              candidate_digest=$(resolve_digest "$candidate" || true)
              if [[ "$candidate_digest" == sha256:* ]]; then
                source_image="$candidate"
                break
              fi
            done
            if [ -z "$source_image" ]; then
              echo "no immutable PostgreSQL source image is available" >&2
              exit 1
            fi
            docker buildx imagetools create --tag "$deployment_tag" "$source_image"
            digest=$(resolve_digest "$deployment_tag")
          fi
          if [[ "$digest" != sha256:* ]]; then
            echo "invalid PostgreSQL candidate digest: $digest" >&2
            exit 1
          fi
          echo "POSTGRES_IMAGE=ghcr.io/p-n-ai/pai-postgres@$digest" >> "$GITHUB_ENV"

      - name: Reuse existing SHA-addressed application images
        id: existing
        if: steps.artifact.outputs.exists != 'true'
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          image_exists() {
            local name="$1"
            local image="$2"
            local output
            local digest
            if output=$(docker buildx imagetools inspect "$image" 2>&1); then
              digest=$(printf '%s\n' "$output" |
                awk '$1 == "Digest:" { print $2; exit }')
              if [[ "$digest" != sha256:* ]]; then
                echo "registry returned an invalid digest for $image" >&2
                return 1
              fi
              echo "${name}_exists=true" >> "$GITHUB_OUTPUT"
              return
            fi
            case "$output" in
              *"manifest unknown"*|*"not found"*)
                echo "${name}_exists=false" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "registry inspection failed for $image" >&2
                return 1
                ;;
            esac
          }
          image_exists app "$REGISTRY/pai-bot/app:$SHA"
          image_exists admin "$REGISTRY/pai-bot/admin:$SHA"

      - name: Build and push SHA-addressed app image
        if: >-
          steps.artifact.outputs.exists != 'true' &&
          steps.existing.outputs.app_exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ secrets.ECR_REGISTRY }}/pai-bot/app:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=nightly-app
          cache-to: type=gha,mode=max,scope=nightly-app

      - name: Build and push SHA-addressed admin image
        if: >-
          steps.artifact.outputs.exists != 'true' &&
          steps.existing.outputs.admin_exists != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile.admin
          push: true
          tags: ${{ secrets.ECR_REGISTRY }}/pai-bot/admin:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=nightly-admin
          cache-to: type=gha,mode=max,scope=nightly-admin

      - name: Resolve immutable image digests
        if: steps.artifact.outputs.exists != 'true'
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          resolve_digest() {
            docker buildx imagetools inspect "$1" 2> /dev/null |
              awk '$1 == "Digest:" { print $2; exit }'
          }
          app_digest=$(resolve_digest "$REGISTRY/pai-bot/app:$SHA")
          admin_digest=$(resolve_digest "$REGISTRY/pai-bot/admin:$SHA")
          if [[ "$app_digest" != sha256:* || "$admin_digest" != sha256:* ]]; then
            echo "candidate image pair is incomplete after construction" >&2
            exit 1
          fi
          echo "APP_DIGEST=$app_digest" >> "$GITHUB_ENV"
          echo "ADMIN_DIGEST=$admin_digest" >> "$GITHUB_ENV"

      - name: Record candidate provenance
        if: steps.artifact.outputs.exists != 'true'
        env:
          REGISTRY: ${{ secrets.ECR_REGISTRY }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$SHA" \
            --argjson nightly_run_id "$GITHUB_RUN_ID" \
            --argjson source_run_id "$SOURCE_RUN_ID" \
            --arg app_image "$REGISTRY/pai-bot/app@$APP_DIGEST" \
            --arg admin_image "$REGISTRY/pai-bot/admin@$ADMIN_DIGEST" \
            --arg postgres_image "$POSTGRES_IMAGE" \
            '{
              repository: $repository,
              sha: $sha,
              nightly_run_id: $nightly_run_id,
              source_run_id: $source_run_id,
              app_image: $app_image,
              admin_image: $admin_image,
              postgres_image: $postgres_image
            }' > candidate.json

      - name: Publish immutable candidate metadata
        if: steps.artifact.outputs.exists != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-candidate-${{ github.event.workflow_run.head_sha }}
          path: candidate.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish nightly GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ ! -s candidate.json ]; then
            echo "candidate.json is missing or empty" >&2
            exit 1
          fi
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$SHA" \
            '.repository == $repository and .sha == $sha' \
            candidate.json >/dev/null

          tag="nightly-$SHA"
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null) || tag_sha=""
          if [ -n "$tag_sha" ] && [ "$tag_sha" != "$SHA" ]; then
            echo "tag $tag points to $tag_sha, expected $SHA" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists"
            exit 0
          fi

          release_args=(
            "$tag"
            candidate.json
            --prerelease
            --latest=false
            --generate-notes
            --title "Nightly ${SHA:0:12}"
          )
          if [ -n "$tag_sha" ]; then
            release_args+=(--verify-tag)
          else
            release_args+=(--target "$SHA")
          fi
          gh release create "${release_args[@]}"
