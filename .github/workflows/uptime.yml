name: Uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      verification_mode:
        description: Run normally or fail after a healthy owned-origin response
        required: true
        default: healthy
        type: choice
        options:
          - healthy
          - deliberate-failure

concurrency:
  group: uptime-production-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.PAI_UPTIME_ENABLED == 'true')
    name: Application and AI provider health probe
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: production
    env:
      TARGET_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Require monitoring target
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "::error::Set NEXT_PUBLIC_API_URL in the production environment."
            exit 1
          fi

      - name: Probe application and AI provider status
        env:
          VERIFICATION_MODE: ${{ inputs.verification_mode }}
        run: |
          if [ "$VERIFICATION_MODE" = "deliberate-failure" ]; then
            python3 scripts/uptime_probe.py "$TARGET_URL" --check status --timeout 30 --deliberate-failure
          else
            python3 scripts/uptime_probe.py "$TARGET_URL" --check status --timeout 30
          fi
