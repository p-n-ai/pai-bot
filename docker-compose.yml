services:
  postgres:
    image: ${POSTGRES_IMAGE:-ghcr.io/p-n-ai/pai-postgres:pggraph-1.0.0-pgvector-0.8.5}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.postgres
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "shared_preload_libraries=pg_cron,graph", "-c", "cron.database_name=pai"]
    environment:
      POSTGRES_USER: pai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pai}
      POSTGRES_DB: pai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pai && psql -U pai -d pai -Atqc \"SELECT count(*) = 2 AND bool_and((name = 'graph' AND default_version = '1.0.0') OR (name = 'vector' AND default_version = '0.8.5')) FROM pg_available_extensions WHERE name IN ('graph', 'vector')\" | grep -qx t"]
      interval: 5s
      timeout: 3s
      retries: 5

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    ports:
      - "6379:6379"
    volumes:
      - dragonfly-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  goose:
    image: golang:1.25
    profiles:
      - tools
    working_dir: /app
    volumes:
      - ./:/app
      - goose-gomod:/go/pkg/mod
      - goose-gocache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      LEARN_SERVER_HOST: 0.0.0.0
      LEARN_SERVER_PORT: 8080
      LEARN_DATABASE_URL: postgres://pai:${POSTGRES_PASSWORD:-pai}@postgres:5432/pai?sslmode=disable
      LEARN_CACHE_URL: redis://dragonfly:6379
      LEARN_AI_OLLAMA_URL: http://ollama:11434
      LEARN_AI_CODEX_HOME: /var/lib/pai-bot/codex
    volumes:
      - codex-data:/var/lib/pai-bot/codex
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.admin
    expose:
      - "3000"
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
      admin:
        condition: service_started
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    profiles:
      - ollama

volumes:
  postgres-data:
  dragonfly-data:
  caddy_data:
  caddy_config:
  ollama-data:
  codex-data:
  goose-gomod:
  goose-gocache:
