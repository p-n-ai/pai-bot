# Production overrides for single-server deployment
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  config-check:
    image: pai-bot:latest
    env_file:
      - .env
    entrypoint:
      - /pai-validate-production-secrets
    restart: "no"

  postgres:
    build: !reset null
    ports: !reset []
    environment:
      POSTGRES_USER: pai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: pai
    deploy:
      resources:
        limits:
          memory: 512M

  dragonfly:
    ports: !reset []
    command: ["--maxmemory", "256mb", "--proactor_threads", "1"]
    deploy:
      resources:
        limits:
          memory: 300M

  app:
    image: pai-bot:latest
    build: !reset null
    dns: !reset []
    environment:
      LEARN_DEV_MODE: "false"
      PAI_AUTH_SECRET: ${PAI_AUTH_SECRET:?Set a private PAI_AUTH_SECRET}
      PAI_CONFIG_ENCRYPTION_KEY: ${PAI_CONFIG_ENCRYPTION_KEY:?Set an independent PAI_CONFIG_ENCRYPTION_KEY}
      PAI_CONFIG_PREVIOUS_ENCRYPTION_KEYS: ${PAI_CONFIG_PREVIOUS_ENCRYPTION_KEYS:-[]}
      PAI_AUTH_BOOTSTRAP_ADMIN_EMAIL: ${PAI_AUTH_BOOTSTRAP_ADMIN_EMAIL:?Set PAI_AUTH_BOOTSTRAP_ADMIN_EMAIL}
      PAI_AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${PAI_AUTH_BOOTSTRAP_ADMIN_PASSWORD:?Set a private PAI_AUTH_BOOTSTRAP_ADMIN_PASSWORD}
    depends_on:
      config-check:
        condition: service_completed_successfully
    ports: !reset []
    expose:
      - "8080"
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  admin:
    image: pai-admin:latest
    build: !reset null
    depends_on:
      app:
        condition: service_started
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M

  caddy:
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      app:
        condition: service_started
      admin:
        condition: service_started
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
